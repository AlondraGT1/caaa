<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precios</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css"/>
  <style>
    body {
      background: #f8f9fa;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .result {
      font-size: 1.5rem;
      font-weight: bold;
    }
    table {
      margin-top: 2rem;
    }
    .historial {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 animate__animated animate__fadeIn">
          <h2 class="text-center mb-4">🧮 Calculadora de Precios</h2>
          <div class="mb-3">
            <label for="concepto" class="form-label">Nombre del Producto</label>
            <input type="text" id="concepto" class="form-control" placeholder="Ej. Camiseta personalizada">
          </div>
          <div class="mb-3">
            <label for="costo" class="form-label">Costo base ($)</label>
            <input type="number" id="costo" class="form-control" placeholder="Ej. 100">
          </div>
          <div class="mb-3">
            <label for="ganancia" class="form-label">% de Ganancia Deseado</label>
            <input type="number" id="ganancia" class="form-control" placeholder="Ej. 30">
          </div>
          <button class="btn btn-primary w-100" onclick="calcularPrecio()">Calcular 💰</button>
          <div id="resultado" class="mt-4 text-center animate__animated" style="display: none;">
            <p class="result">Precio de venta sugerido: <span id="precioFinal">$0.00</span></p>
            <p class="text-success">Margen de ganancia: <span id="margen">0%</span> 📈</p>
          </div>
        </div>

        <div class="text-end mt-4">
          <button class="btn btn-success me-2" onclick="exportarExcel()">📊 Exportar Excel</button>
          <button class="btn btn-danger me-2" onclick="exportarPDF()">📄 Exportar PDF</button>
          <button class="btn btn-secondary" onclick="limpiarTabla()">🧹 Limpiar Tabla</button>
        </div>

        <div class="table-responsive animate__animated animate__fadeIn">
          <table class="table table-striped mt-4" id="tablaProductos">
            <thead class="table-dark">
              <tr>
                <th>Concepto</th>
                <th>Costo Base ($)</th>
                <th>% Ganancia</th>
                <th>Precio Sugerido ($)</th>
              </tr>
            </thead>
            <tbody>
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>

        <div class="historial">
          <h5>📜 Historial de cálculos</h5>
          <ul id="historialCalculos" class="list-group"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- JS para cálculos y exportación -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const productos = [];

    function calcularPrecio() {
      const conceptoInput = document.getElementById('concepto');
      const costoInput = document.getElementById('costo');
      const gananciaInput = document.getElementById('ganancia');

      const concepto = conceptoInput.value.trim();
      const costo = parseFloat(costoInput.value);
      const ganancia = parseFloat(gananciaInput.value);

      if (!concepto || isNaN(costo) || isNaN(ganancia) || costo < 0 || ganancia < 0) {
        alert('Por favor ingresa valores válidos.');
        return;
      }

      const precioVenta = costo + (costo * ganancia / 100);
      const margenGanancia = ((precioVenta - costo) / costo) * 100;

      document.getElementById('precioFinal').innerText = `$${precioVenta.toFixed(2)}`;
      document.getElementById('margen').innerText = `${margenGanancia.toFixed(2)}%`;
      const resultado = document.getElementById('resultado');
      resultado.style.display = 'block';
      resultado.classList.remove('animate__fadeOut');
      resultado.classList.add('animate__fadeIn');

      const producto = { concepto, costo, ganancia, precio: precioVenta };
      productos.push(producto);
      actualizarTabla();
      agregarHistorial(producto);

      // Limpiar campos y enfocar
      conceptoInput.value = '';
      costoInput.value = '';
      gananciaInput.value = '';
      conceptoInput.focus();
    }

    function actualizarTabla() {
      const tbody = document.querySelector('#tablaProductos tbody');
      tbody.innerHTML = '';
      productos.forEach(prod => {
        const row = `<tr>
          <td>${prod.concepto}</td>
          <td>$${prod.costo.toFixed(2)}</td>
          <td>${prod.ganancia.toFixed(2)}%</td>
          <td>$${prod.precio.toFixed(2)}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function agregarHistorial(prod) {
      const historial = document.getElementById('historialCalculos');
      const item = document.createElement('li');
      item.classList.add('list-group-item');
      item.textContent = `${prod.concepto}: costo $${prod.costo.toFixed(2)}, ganancia ${prod.ganancia.toFixed(2)}%, precio $${prod.precio.toFixed(2)}`;
      historial.prepend(item);
    }

    function exportarExcel() {
      const wb = XLSX.utils.book_new();
      const ws_data = [['Concepto', 'Costo Base ($)', '% Ganancia', 'Precio Sugerido ($)']];
      productos.forEach(p => {
        ws_data.push([p.concepto, p.costo, p.ganancia, p.precio]);
      });
      const ws = XLSX.utils.aoa_to_sheet(ws_data);
      XLSX.utils.book_append_sheet(wb, ws, 'Productos');
      XLSX.writeFile(wb, 'productos.xlsx');
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(14);
      doc.text('Lista de Productos Calculados', 10, 10);

      let y = 20;
      doc.text('Concepto | Costo Base | % Ganancia | Precio Sugerido', 10, y);
      y += 10;
      productos.forEach(p => {
        doc.text(`${p.concepto} | $${p.costo.toFixed(2)} | ${p.ganancia.toFixed(2)}% | $${p.precio.toFixed(2)}`, 10, y);
        y += 10;
      });
      doc.save('productos.pdf');
    }

    function limpiarTabla() {
      productos.length = 0;
      actualizarTabla();
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('historialCalculos').innerHTML = '';
    }
  </script>
</body>
</html>
